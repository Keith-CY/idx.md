  title: quality-assurance
  summary: >-
    Validates content and brand guidelines against brand standards. Use this
    agent to check compliance, consistency, completeness, and open question
    coverage before finalizing output.

    <example> Context: The brand-voice-enforcement skill has generated a cold
    email and wants to validate it against guidelines before presenting to the
    user. user: "Check this email against our brand guidelines" assistant: "Let
    me validate this against your brand guidelines..." <commentary> Content
    needs validation against brand standards before delivery. The
    quality-assurance agent performs a fast, structured compliance check.
    </commentary> </example>

    <example> Context: Brand guidelines were just generated and need validation
    before presenting. user: "Validate these brand guidelines for completeness
    and quality" assistant: "Let me check the guidelines for completeness,
    consistency, and open questions..." <commentary> Generated guidelines need
    quality validation before presenting to the user. The quality-assurance
    agent checks completeness, open questions coverage, and PII. </commentary>
    </example>

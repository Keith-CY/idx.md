  source_url: https://raw.githubusercontent.com/anthropics/knowledge-work-plugins/main/partner-built/brand-voice/agents/document-analysis.md
  title: document-analysis
  summary: >-
    Analyzes brand documents to extract voice attributes, messaging,
    terminology, and examples. Use this agent when processing multiple brand
    documents or performing cross-document pattern recognition.

    <example> Context: The guideline-generation skill has received 5 brand
    documents to process. user: "Generate brand guidelines from these 5
    documents" assistant: "I'll analyze all documents to extract brand
    elements..." <commentary> Multiple documents need parallel processing and
    cross-document pattern recognition. The document-analysis agent handles
    heavy parsing efficiently. </commentary> </example>

    <example> Context: Discovery found brand documents on Notion and Confluence
    that need deep analysis. user: "Analyze the brand materials found during
    discovery" assistant: "I'll do a deep analysis of each discovered
    document..." <commentary> Discovery report identified key documents. The
    document-analysis agent fetches full content from connected platforms and
    extracts structured brand elements. </commentary> </example>
  tags:
    - source-knowledge-work-plugins
    - plugin-partner-built
    - plugin-component-brand-voice
  upstream_ref: https://github.com/anthropics/knowledge-work-plugins/blob/main/partner-built/brand-voice/agents/document-analysis.md
- type: skills
  slug: knowledge-work-plugins-partner-built-brand-voice-agents-content-generation
  source_url: https://raw.githubusercontent.com/anthropics/knowledge-work-plugins/main/partner-built/brand-voice/agents/content-generation.md
  title: content-generation
  summary: >-
    Generates brand-aligned sales and marketing content by applying brand
    guidelines to specific content requests. Use this agent for long-form
    content, batch generation, or when multiple brand constraints must be
    balanced simultaneously.

    <example> Context: The brand-voice-enforcement skill needs to generate a
    detailed enterprise proposal. It delegates to the content-generation agent
    for long-form, multi-constraint content creation. user: "Write a 5-page
    proposal for our AI platform at a Fortune 500" assistant: "I'll generate a
    brand-aligned proposal applying all guidelines..." <commentary> Long-form
    content requiring simultaneous application of multiple brand constraints.
    The content-generation agent handles complex generation with thorough
    validation. </commentary> </example>

    <example> Context: User needs a batch of personalized outreach emails for
    different personas. user: "Create 5 cold emails for different buyer personas
    using our brand voice" assistant: "I'll generate brand-aligned emails
    tailored to each persona..." <commentary> Batch content generation requiring
    brand consistency across multiple variations. The content-generation agent
    balances brand constraints with persona-specific adaptation. </commentary>
    </example>
  tags:
    - source-knowledge-work-plugins
    - plugin-partner-built
    - plugin-component-brand-voice
  upstream_ref: https://github.com/anthropics/knowledge-work-plugins/blob/main/partner-built/brand-voice/agents/content-generation.md
- type: skills
  slug: knowledge-work-plugins-partner-built-brand-voice-agents-discover-brand
  source_url: https://raw.githubusercontent.com/anthropics/knowledge-work-plugins/main/partner-built/brand-voice/agents/discover-brand.md
  title: discover-brand
  summary: >-
    Autonomously searches enterprise platforms to discover brand-related
    documents, transcripts, and design assets. Use when the user wants to build
    brand guidelines but doesn't know where materials are, or wants a
    comprehensive brand content audit.

    <example> Context: User wants to create brand guidelines but doesn't know
    what materials exist. user: "I need brand guidelines but our stuff is
    scattered everywhere — Notion, Confluence, Google Drive, Box..." assistant:
    "I'll search across your connected platforms to find all brand-related
    materials." <commentary> User has scattered brand materials across multiple
    platforms. The discover-brand agent autonomously searches all connected MCP
    platforms to find and triage brand content. </commentary> </example>

    <example> Context: User wants a brand content audit before generating
    guidelines. user: "What brand materials do we actually have? Can you find
    everything?" assistant: "I'll run a comprehensive brand discovery across
    your connected platforms." <commentary> User wants to understand what brand
    materials exist. The discover-brand agent searches, categorizes, ranks, and
    reports on all discovered brand content. </commentary> </example>

    <example> Context: The discover-brand skill delegates deep platform search
    to this agent. user: "Discover our brand voice" assistant: "I'll search your
    connected platforms for brand materials..." <commentary> The discover-brand
    skill orchestrates this agent for the heavy search and triage work.
    </commentary> </example>
  tags:
    - source-knowledge-work-plugins
    - plugin-partner-built
    - plugin-component-brand-voice
  upstream_ref: https://github.com/anthropics/knowledge-work-plugins/blob/main/partner-built/brand-voice/agents/discover-brand.md
- type: skills
  slug: knowledge-work-plugins-partner-built-brand-voice-agents-conversation-analysis
  source_url: https://raw.githubusercontent.com/anthropics/knowledge-work-plugins/main/partner-built/brand-voice/agents/conversation-analysis.md
  title: conversation-analysis
  summary: >-
    Analyzes sales call transcripts to extract brand voice patterns, messaging
    effectiveness, and tone variations. Use this agent when processing multiple
    transcripts or performing deep pattern recognition across conversations.

    <example> Context: The guideline-generation skill has 10 sales call
    transcripts to analyze. user: "Generate brand guidelines from my last 10
    sales calls" assistant: "I'll analyze the transcripts for voice patterns and
    messaging..." <commentary> Multiple transcripts need deep pattern
    recognition across conversations. The conversation-analysis agent handles
    this heavy analysis. </commentary> </example>

    <example> Context: Gong transcripts were found during brand discovery and
    need analysis. user: "Analyze the Gong calls found during discovery"
    assistant: "I'll pull the transcripts from Gong and analyze voice
    patterns..." <commentary> Discovery identified relevant Gong recordings. The
    conversation-analysis agent fetches transcripts via MCP and performs deep
    pattern analysis. </commentary> </example>
